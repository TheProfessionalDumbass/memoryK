name: Build GKI LKM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "GKI branch/version (example: android15-6.6)"
        required: true
        default: "android15-6.6"
        type: string

      sub_level:
        description: "Linux sublevel (example: 89 = Linux 6.6.89)"
        required: true
        default: "89"
        type: string

      os_patch_level:
        description: "GKI patch level (example: 2025-06)"
        required: true
        default: "2025-06"
        type: string

jobs:
  build-lkm:
    uses: ./.github/workflows/gki-kernel.yml

    with:
      version: ${{ inputs.version }}

      version_name: ${{ format(
        '{0}.{1}',
        inputs.version,
        inputs.sub_level
        ) }}

      # IMPORTANT:
      # gki-kernel.yml turns this into:
      # common-${tag}
      #
      # Therefore this MUST NOT contain _r23.
      tag: ${{ format(
        '{0}-{1}',
        inputs.version,
        inputs.os_patch_level
        ) }}

      os_patch_level: ${{ inputs.os_patch_level }}

      build_lkm: true
