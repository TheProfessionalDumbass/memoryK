name: GKI Kernel Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: >
          Output directory of gki,
          for example: android12-5.10
      version_name:
        required: true
        type: string
        description: >
          With SUBLEVEL of kernel,
          for example: android12-5.10.66
      manifest_branch:
        required: true
        type: string
        description: >
          Full branch name in kernel/manifest,
          for example: common-android15-6.6-2025-06
      kernel_tag:
        required: true
        type: string
        description: >
          Exact release tag in kernel/common,
          for example: android15-6.6-2025-06_r23
      kernel_sha:
        required: true
        type: string
        description: Exact common-kernel commit from the GKI release listing
      os_patch_level:
        required: false
        type: string
        description: >
          Patch level of common kernel manifest,
          for example: 2021-11
        default: 2022-05
      patch_path:
        required: false
        type: string
        description: >
          Directory name of .github/patches/<patch_path>
          for example: 5.10
      use_cache:
        required: false
        type: boolean
        default: true
      debug:
        required: false
        type: boolean
        default: false
      build_lkm:
        required: false
        type: boolean
        default: false
    secrets:
      BOOT_SIGN_KEY:
        required: false
      CHAT_ID:
        required: false
      BOT_TOKEN:
        required: false
      MESSAGE_THREAD_ID:
        required: false

jobs:
  build:
    name: Build ${{ inputs.version_name }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v4
        with:
          path: MemKernel
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup kernel source
        env:
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
          KERNEL_TAG: ${{ inputs.kernel_tag }}
          KERNEL_SHA: ${{ inputs.kernel_sha }}
        run: |
          set -euo pipefail
          echo "Free space:"
          df -h
          cd "$GITHUB_WORKSPACE"
          sudo apt-get install repo -y
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --repo-rev=v2.16

          COMMON_BRANCH="${MANIFEST_BRANCH#common-}"
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if git ls-remote --exit-code --heads \
              https://android.googlesource.com/kernel/common \
              "deprecated/${COMMON_BRANCH}" >/dev/null 2>&1; then
            echo "Found deprecated branch: ${COMMON_BRANCH}"
            sed -i "s/\"${COMMON_BRANCH}\"/\"deprecated\\/${COMMON_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
            cat "$DEFAULT_MANIFEST_PATH"
          fi

          repo --version
          repo --trace sync -c -j"$(nproc --all)" --no-tags

          # repo uses the manifest branch for the full build environment. The
          # exact GKI release is a separate tag in kernel/common.
          git -C common fetch --depth=1 \
            https://android.googlesource.com/kernel/common \
            "refs/tags/${KERNEL_TAG}:refs/tags/${KERNEL_TAG}"
          TAG_COMMIT="$(git -C common rev-parse "refs/tags/${KERNEL_TAG}^{commit}")"
          git -C common checkout --detach "$TAG_COMMIT"
          test "$(git -C common rev-parse HEAD)" = "$TAG_COMMIT"
          test "$TAG_COMMIT" = "$KERNEL_SHA"
          echo "Manifest branch: ${MANIFEST_BRANCH}"
          echo "Kernel tag: ${KERNEL_TAG} (${TAG_COMMIT})"
          df -h

      - name: Setup MemKernel
        env:
          PATCH_PATH: ${{ inputs.patch_path }}
          IS_DEBUG_KERNEL: ${{ inputs.debug }}
          BUILD_LKM: ${{ inputs.build_lkm }}
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/android-kernel
          echo "[+] MemKernel setup"
          GKI_ROOT=$(pwd)
          echo "[+] GKI_ROOT: $GKI_ROOT"
          if [ "$BUILD_LKM" = "true" ]; then
            # External modules do not modify kernel/common. Kleaf stamps the
            # original, pinned GKI commit and Kbuild runs normal modpost.
            cp -a "$GITHUB_WORKSPACE/MemKernel/kernel" "$GKI_ROOT/memkernel"
            test -f "$GKI_ROOT/memkernel/Makefile"
            test "$(git -C common rev-parse HEAD)" = '${{ inputs.kernel_sha }}'
            test -z "$(git -C common status --porcelain)"
          else
            cp -a "$GITHUB_WORKSPACE/MemKernel/kernel" "$GKI_ROOT/common/drivers/memkernel"
            DRIVER_MAKEFILE=$GKI_ROOT/common/drivers/Makefile
            DRIVER_KCONFIG=$GKI_ROOT/common/drivers/Kconfig
            grep -q "memkernel" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_MEMKERNEL) += memkernel/\n" >> "$DRIVER_MAKEFILE"
            grep -q "memkernel" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/memkernel/Kconfig\"" "$DRIVER_KCONFIG"
          fi

          if [ "$IS_DEBUG_KERNEL" = "true" ]; then
            echo "[+] Enable debug features for kernel"
            printf "\nccflags-y += -DCONFIG_MEMKERNEL_DEBUG\n" >> $GITHUB_WORKSPACE/MemKernel/kernel/Makefile
          fi
          repo status
          echo "[+] MemKernel setup done."

      - name: Setup ccache
        if: inputs.use_cache == true
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gki-kernel-aarch64-${{ inputs.version_name }}
          max-size: 2G
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Set up LKM without bypassing export checks
        if: ${{ inputs.build_lkm == true }}
        working-directory: android-kernel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-15 kmod
          test -f memkernel/Makefile
          test -f memkernel/BUILD.bazel
          test -z "$(git -C common status --porcelain)"

      - name: Commit kernel integration for stamped builds
        if: ${{ inputs.build_lkm == false }}
        working-directory: android-kernel
        run: |
          set -euo pipefail
          git config --global user.email "bot@kernelsu.org"
          git config --global user.name "KernelSUBot"
          cd common/
          git add -A
          git commit -m "Add MemKernel"
          repo status

      - name: Build Kernel/LKM
        working-directory: android-kernel
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_lkm }}" = "true" ]; then
            if [ -e build/build.sh ]; then
              EXT_MODULES=memkernel LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"
              module="$(find out -type f -name miprotect.ko -print -quit)"
            else
              if [ '${{ inputs.kernel_tag }}' = 'android16-6.12-2026-06_r29' ]; then
                # This certified CI build includes the release's rust_binder.ko.
                # Use Kleaf's Bzlmod prebuilt extension and normal modpost/KMI
                # checks; the legacy --use_prebuilt_gki alias is unavailable.
                prebuilt_dir="$PWD/prebuilts/gki-android16"
                PYTHONPATH="$PWD/build/kernel${PYTHONPATH:+:$PYTHONPATH}" \
                  python3 build/kernel/init/init_ddk.py \
                    --build_id 16385436 \
                    --build_target kernel_aarch64 \
                    --prebuilts_dir "$prebuilt_dir" \
                    --url_fmt 'https://ci.android.com/builds/submitted/{build_id}/{build_target}/latest/raw/{filename}'
                test -s "$prebuilt_dir/ci_target_mapping.json"
                grep -Fq 'kernel_release=6.12.81-android16-6-g5a474838a54e-' "$prebuilt_dir/gki-info.txt"
                curl -fsSL 'https://ci.android.com/builds/submitted/16385436/kernel_aarch64/latest/raw/BUILD_INFO' -o "$prebuilt_dir/BUILD_INFO"
                jq -e --arg sha '${{ inputs.kernel_sha }}' '.parsed_manifest.projects[] | select(.path == "common") | .revision == $sha' "$prebuilt_dir/BUILD_INFO"
                cat >> MODULE.bazel <<'EOF'
          kernel_prebuilt_ext = use_extension(
              "//build/kernel/kleaf:kernel_prebuilt_ext.bzl",
              "kernel_prebuilt_ext",
          )
          kernel_prebuilt_ext.declare_kernel_prebuilts(
              name = "gki_prebuilts",
              local_artifact_path = "prebuilts/gki-android16",
              target = "kernel_aarch64",
          )
          use_repo(kernel_prebuilt_ext, "gki_prebuilts")
          EOF
                sed -i 's|//common:kernel_aarch64|@gki_prebuilts//kernel_aarch64|' memkernel/BUILD.bazel
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=release //memkernel:miprotect
              else
                tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=release --lto=thin //memkernel:miprotect
              fi
              module="$(find -L bazel-bin/memkernel -type f -name miprotect.ko -print -quit)"
            fi
            test -n "$module"
            test -s "$module"
            mkdir -p dist
            cp "$module" dist/miprotect.ko
            test -z "$(git -C common status --porcelain)"
          elif [ -e build/build.sh ]; then
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"
          else
            tools/bazel run --disk_cache=/home/runner/.cache/bazel --config=fast --config=stamp --lto=thin //common:kernel_aarch64_dist -- --dist_dir=dist
          fi

      - name: Prepare artifacts
        id: prepareArtifacts
        run: |
          OUTDIR=android-kernel/out/${{ inputs.version }}/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          mkdir output
          if [ "${{ inputs.build_lkm}}" = "true" ]; then
            test -s "$OUTDIR/miprotect.ko"
            llvm-strip-15 -d "$OUTDIR/miprotect.ko"
            module="./output/${{ inputs.version }}_miprotect.ko"
            mv "$OUTDIR/miprotect.ko" "$module"
            vermagic="$(modinfo -F vermagic "$module")"
            expected="${{ inputs.version_name }}"
            expected="${expected#*-}"
            case "$vermagic" in "$expected"*) ;; *) echo "Unexpected vermagic: $vermagic"; exit 1 ;; esac
            expected_scm="g$(printf '%s' '${{ inputs.kernel_sha }}' | cut -c1-12)"
            family='${{ inputs.version }}'
            family="${family%%-*}"
            release="${vermagic%% *}"
            case "$release" in "$expected"-"$family"*) ;; *) echo "::error::Wrong GKI release family: $vermagic"; exit 1 ;; esac
            if [[ "$release" =~ -g[0-9a-fA-F]{12,40} ]] && [[ "$release" != *"$expected_scm"* ]]; then
              echo "::error::Module embeds a different kernel commit: $vermagic"
              exit 1
            fi
            if [[ "$release" == *"_r"* ]] && [[ "$release" != *'${{ inputs.kernel_tag }}'* ]]; then
              echo "::error::Module embeds a different release tag: $vermagic"
              exit 1
            fi
            if [[ "$release" == *"$expected_scm"* ]]; then
              provenance=embedded_commit
            elif [[ "$release" == *'${{ inputs.kernel_tag }}'* ]]; then
              provenance=embedded_tag
            else
              provenance=pinned_source_checkout
            fi
            test "$(git -C android-kernel/common rev-parse HEAD)" = '${{ inputs.kernel_sha }}'
            test -z "$(git -C android-kernel/common status --porcelain)"
            case "$vermagic" in *-dirty*) echo "::error::Dirty kernel version: $vermagic"; exit 1 ;; esac
            printf '%s\n' "$vermagic" > ./output/vermagic.txt
            sha256sum "$module" > ./output/miprotect.ko.sha256
            printf 'tag=%s\ncommit=%s\nvermagic=%s\nprovenance=%s\n' \
              '${{ inputs.kernel_tag }}' '${{ inputs.kernel_sha }}' "$vermagic" "$provenance" \
              > ./output/build-info.txt
          else
            cp $OUTDIR/Image ./output/
            cp $OUTDIR/Image.lz4 ./output/
            git clone https://github.com/Kernel-SU/AnyKernel3
            rm -rf ./AnyKernel3/.git
            cp $OUTDIR/Image ./AnyKernel3/
          fi

      - name: Upload Image and Image.gz
        uses: actions/upload-artifact@v4
        if: ${{ inputs.build_lkm == false }}
        with:
          name: Image-${{ inputs.version_name }}_${{ inputs.os_patch_level }}
          path: ./output/*

      - name: Upload AnyKernel3
        if: ${{ inputs.build_lkm == false }}
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ inputs.version_name }}_${{ inputs.os_patch_level }}
          path: ./AnyKernel3/*

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        if: ${{ inputs.build_lkm == true }}
        with:
          name: ${{ inputs.version }}-lkm
          if-no-files-found: error
          path: ./output/*


