name: Build miprotect LKM for Infinity X marble

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/infinityx.yml"
  pull_request:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/infinityx.yml"
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Infinity X kernel repository
        required: true
        default: aosp-pablo/android_kernel_xiaomi_sm8450
        type: string
      kernel_ref:
        description: Exact Infinity X branch, tag, or full commit
        required: true
        default: b4d13be4e909f7b74299b45ff0e8696226ca5fd8
        type: string
      expected_release:
        description: Exact uname -r that the LKM must match
        required: true
        default: 5.10.252-Infx-gb4d13be4e909
        type: string
      clang_ref:
        description: Google Android Clang repository commit/ref containing clang-r563880
        required: true
        default: d2de056d8d8de40b2c1ccd39bfadf0c0318f5bad
        type: string
      clang_dir:
        description: Google Android Clang directory
        required: true
        default: clang-r563880c
        type: string

permissions:
  contents: read

concurrency:
  group: infinityx-lkm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkm:
    name: Infinity X marble miprotect.ko
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64

      KERNEL_REPO: ${{ inputs.kernel_repo || 'aosp-pablo/android_kernel_xiaomi_sm8450' }}
      KERNEL_REF: ${{ inputs.kernel_ref || 'b4d13be4e909f7b74299b45ff0e8696226ca5fd8' }}
      EXPECTED_RELEASE: ${{ inputs.expected_release || '5.10.252-Infx-gb4d13be4e909' }}

      CLANG_REF: ${{ inputs.clang_ref || 'd2de056d8d8de40b2c1ccd39bfadf0c0318f5bad' }}
      CLANG_DIR: ${{ inputs.clang_dir || 'clang-r563880c' }}

      KERNEL_DIR: kernel-source
      OUT_DIR: out
      DIST_DIR: dist

      KBUILD_BUILD_USER: infinityx
      KBUILD_BUILD_HOST: github-actions

      CONFIG_FRAGMENTS: >-
        vendor/waipio_GKI.config
        vendor/xiaomi_GKI.config
        vendor/marble_GKI.config
        vendor/debugfs.config
        vendor/infinity.config

    steps:
      - name: Reclaim runner disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1536
          temp-reserve-mb: 256
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Check out MemKernel
        uses: actions/checkout@v4
        with:
          path: MemKernel
          fetch-depth: 1

      - name: Check out exact Infinity X kernel base
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          path: ${{ env.KERNEL_DIR }}
          # Keep the checkout shallow so setlocalversion reproduces the
          # head-only -g<12-char-SHA> form used by EXPECTED_RELEASE.
          fetch-depth: 1

      - name: Verify checked-out kernel revision
        working-directory: kernel-source
        run: |
          set -euo pipefail

          resolved_commit="$(git rev-parse HEAD)"
          echo "Requested ref: ${KERNEL_REF}"
          echo "Resolved commit: ${resolved_commit}"

          # If KERNEL_REF is a full 40-character SHA, require an exact match.
          if [[ "${KERNEL_REF}" =~ ^[0-9a-fA-F]{40}$ ]] &&
             [[ "${resolved_commit,,}" != "${KERNEL_REF,,}" ]]; then
            echo "::error::Checked-out kernel commit does not match KERNEL_REF."
            exit 1
          fi

          git diff --quiet
          git diff --cached --quiet

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            curl \
            dwarves \
            flex \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            xz-utils \
            zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          df -h /
          free -h

      - name: Download matching Google Android Clang
        run: |
          set -euo pipefail

          mkdir -p toolchain

          archive_url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REF}/${CLANG_DIR}.tar.gz"

          curl --fail --location --retry 4 --retry-all-errors \
            "${archive_url}" \
            -o clang.tar.gz

          tar -xzf clang.tar.gz -C toolchain
          rm -f clang.tar.gz

          test -x toolchain/bin/clang
          toolchain/bin/clang --version

      - name: Validate external module source
        run: |
          set -euo pipefail

          test -d MemKernel/kernel
          test -f MemKernel/kernel/Makefile
          test -f MemKernel/kernel/Kconfig
          test -f MemKernel/kernel/memory.c
          test -f MemKernel/kernel/process.c
          test -f MemKernel/kernel/entry.c

          echo "miprotect will be built as an external module."
          echo "The Infinity X kernel source tree will not be modified."

      - name: Configure Infinity X marble kernel
        working-directory: kernel-source
        env:
          CC: clang
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"

          make O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            gki_defconfig

          fragment_paths=()

          for fragment in ${CONFIG_FRAGMENTS}; do
            path="arch/arm64/configs/${fragment}"

            if [[ ! -f "${path}" ]]; then
              echo "::error::Missing Infinity X config fragment: ${path}"
              exit 1
            fi

            fragment_paths+=("${path}")
          done

          scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            "${fragment_paths[@]}"

          # Reproduce the installed Infinity X release string.
          scripts/config --file "${OUT_DIR}/.config" \
            --set-str LOCALVERSION "-Infx"

          scripts/config --file "${OUT_DIR}/.config" \
            --enable LOCALVERSION_AUTO

          make O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            olddefconfig

          grep -qx 'CONFIG_LOCALVERSION="-Infx"' "${OUT_DIR}/.config"
          grep -qx 'CONFIG_LOCALVERSION_AUTO=y' "${OUT_DIR}/.config"

          # Building an external module requires module support.
          grep -qx 'CONFIG_MODULES=y' "${OUT_DIR}/.config"

          echo "Relevant kernel configuration:"
          grep -E '^CONFIG_(LOCALVERSION|MODULES|MODVERSIONS|LTO_CLANG|CFI_CLANG|SHADOW_CALL_STACK)=' \
            "${OUT_DIR}/.config" || true

      - name: Enforce exact installed-kernel release
        id: compatibility
        working-directory: kernel-source
        env:
          CC: clang
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"

          # Nothing in this workflow should have changed tracked kernel files.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Kernel source tree is dirty before kernelrelease calculation."
            git status --short
            git diff -- drivers/Makefile drivers/Kconfig || true
            exit 1
          fi

          actual_release="$(
            make -s O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="${CC}" \
              kernelrelease
          )"

          echo "actual_release=${actual_release}" >> "${GITHUB_OUTPUT}"

          printf 'Expected: %s\nActual:   %s\n' \
            "${EXPECTED_RELEASE}" \
            "${actual_release}"

          if [[ "${actual_release}" != "${EXPECTED_RELEASE}" ]]; then
            echo "::error::Kernel source/ref/config does not reproduce the installed Infinity X kernel release."
            echo "::error::Expected ${EXPECTED_RELEASE}, got ${actual_release}."
            exit 1
          fi

      - name: Build vmlinux and generate Module.symvers
        working-directory: kernel-source
        env:
          CC: clang
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"

          make -j2 O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            Image

          test -s "${OUT_DIR}/vmlinux"
          test -s "${OUT_DIR}/Module.symvers"

          # The source checkout must still be clean after the kernel build.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Kernel build unexpectedly modified tracked source files."
            git status --short
            exit 1
          fi

      - name: Build miprotect.ko as external module
        working-directory: kernel-source
        env:
          CC: clang
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:${PATH}"

          module_dir="${GITHUB_WORKSPACE}/MemKernel/kernel"
          module="${module_dir}/miprotect.ko"

          # CONFIG_MEMKERNEL is supplied on the make command line because the
          # module's Kconfig is intentionally NOT injected into the kernel tree.
          make -j2 O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="${CC}" \
            M="${module_dir}" \
            CONFIG_MEMKERNEL=m \
            modules

          test -s "${module}"

          echo "Built module:"
          file "${module}"
          modinfo "${module}"

          module_release="$(modinfo -F vermagic "${module}" | awk '{print $1}')"

          printf 'Expected vermagic release: %s\nModule vermagic release:   %s\n' \
            "${EXPECTED_RELEASE}" \
            "${module_release}"

          if [[ "${module_release}" != "${EXPECTED_RELEASE}" ]]; then
            echo "::error::miprotect.ko vermagic does not match the installed kernel."
            exit 1
          fi

          # External-module compilation must not dirty the kernel source tree.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::External module build modified tracked kernel source files."
            git status --short
            exit 1
          fi

      - name: Prepare verified artifact
        working-directory: kernel-source
        run: |
          set -euo pipefail

          dist="${GITHUB_WORKSPACE}/${DIST_DIR}"
          module="${GITHUB_WORKSPACE}/MemKernel/kernel/miprotect.ko"

          mkdir -p "${dist}"

          test -s "${module}"
          test -s "${OUT_DIR}/.config"
          test -s "${OUT_DIR}/Module.symvers"

          cp "${module}" "${dist}/miprotect.ko"
          cp "${OUT_DIR}/.config" "${dist}/kernel.config"
          cp "${OUT_DIR}/Module.symvers" "${dist}/Module.symvers"

          {
            echo "kernel_repo=${KERNEL_REPO}"
            echo "requested_ref=${KERNEL_REF}"
            echo "resolved_commit=$(git rev-parse HEAD)"
            echo "kernel_release=${{ steps.compatibility.outputs.actual_release }}"
            echo "clang_dir=${CLANG_DIR}"
            echo "clang_ref=${CLANG_REF}"
            echo
            modinfo "${module}"
          } > "${dist}/build-info.txt"

          (
            cd "${dist}"
            sha256sum miprotect.ko > SHA256SUMS
          )

          echo "Artifact contents:"
          ls -lh "${dist}"

      - name: Upload miprotect LKM
        uses: actions/upload-artifact@v4
        with:
          name: miprotect-${{ steps.compatibility.outputs.actual_release }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
