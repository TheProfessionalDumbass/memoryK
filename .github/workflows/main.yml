name: Build Evolution X Marble LKM

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-lkm-evolution-x.yml"
      - "kernel/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-lkm-evolution-x.yml"
      - "kernel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-x-marble-lkm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkm:
    name: Evolution X marble 5.10.256 LKM
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      TARGET_PRODUCT: marble

      # Exact source currently running on the inspected Evolution X device.
      KERNEL_REPOSITORY: Evolution-X-Devices/kernel_xiaomi_sm8450
      KERNEL_COMMIT: e8fcf25587112c854814dbe399a99110d18c82de
      EXPECTED_KERNEL_RELEASE: 5.10.256-gki-ge8fcf2558711

      # Exact Android Clang revision reported by /proc/version on the device.
      CLANG_REPOSITORY: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_COMMIT: b54cd2c8e9e0bb057aef3804d42d39c5ac4674c7
      CLANG_VERSION: clang-r563880c

      KERNEL_DIR: ${{ github.workspace }}/android-kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out
      MODULE_DIR: ${{ github.workspace }}/module-src
      DIST_DIR: ${{ github.workspace }}/dist
      CCACHE_DIR: ${{ github.workspace }}/.ccache

      # Bump this only when the base-kernel preparation recipe changes.
      PREPARED_CACHE_REVISION: "3"
      MAKE_JOBS: "2"
      KBUILD_BUILD_USER: evolution-x
      KBUILD_BUILD_HOST: github-actions

    steps:
      - name: Checkout MemKernel
        uses: actions/checkout@v4
        with:
          path: MemKernel
          persist-credentials: false

      - name: Checkout exact Evolution X kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPOSITORY }}
          ref: ${{ env.KERNEL_COMMIT }}
          path: android-kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source revision and layout
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C "${KERNEL_DIR}" rev-parse HEAD)"
          test "${actual_commit}" = "${KERNEL_COMMIT}"
          test -z "$(git -C "${KERNEL_DIR}" status --porcelain)"

          test -f "${KERNEL_DIR}/arch/arm64/configs/gki_defconfig"
          for fragment in \
            vendor/waipio_GKI.config \
            vendor/xiaomi_GKI.config \
            vendor/marble_GKI.config \
            vendor/debugfs.config; do
            test -f "${KERNEL_DIR}/arch/arm64/configs/${fragment}"
          done

          test -f "${GITHUB_WORKSPACE}/MemKernel/kernel/Makefile"
          test -f "${GITHUB_WORKSPACE}/MemKernel/kernel/Kconfig"
          echo "Pinned Evolution X kernel: ${actual_commit}"

      - name: Free disk space and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio dwarves flex git kmod \
            libelf-dev libncurses-dev libssl-dev make python3 rsync \
            xz-utils zstd
          df -h /

      - name: Add swap for ThinLTO
        shell: bash
        run: |
          set -euo pipefail
          current_swap_kib="$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)"
          required_swap_kib=$((8 * 1024 * 1024))

          if (( current_swap_kib >= required_swap_kib )); then
            echo "Existing swap is sufficient: $((current_swap_kib / 1024 / 1024)) GiB"
          else
            swap_file="${RUNNER_TEMP}/evox-thinlto.swap"
            if sudo swapon --show=NAME --noheadings | grep -Fxq "${swap_file}"; then
              echo "Workflow swap is already active: ${swap_file}"
            else
              sudo rm -f "${swap_file}"
              sudo fallocate -l 12G "${swap_file}"
              sudo chmod 600 "${swap_file}"
              sudo mkswap "${swap_file}"
              sudo swapon "${swap_file}"
            fi
          fi
          free -h

      - name: Restore Android Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: android-clang
          key: android-clang-${{ runner.os }}-${{ runner.arch }}-r563880c-b54cd2c8

      - name: Fetch pinned Android Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/android-clang-repository"
          rm -rf "${checkout}"
          git init "${checkout}"
          git -C "${checkout}" remote add origin "${CLANG_REPOSITORY}"
          git -C "${checkout}" sparse-checkout init --cone
          git -C "${checkout}" sparse-checkout set "${CLANG_VERSION}"
          git -C "${checkout}" fetch --depth=1 origin "${CLANG_COMMIT}"
          git -C "${checkout}" checkout --detach FETCH_HEAD
          test "$(git -C "${checkout}" rev-parse HEAD)" = "${CLANG_COMMIT}"

          mkdir -p android-clang
          mv "${checkout}/${CLANG_VERSION}" android-clang/
          test -x "android-clang/${CLANG_VERSION}/bin/clang"

      - name: Select and verify compiler
        shell: bash
        run: |
          set -euo pipefail
          clang_bin="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin"
          test -x "${clang_bin}/clang"
          echo "${clang_bin}" >> "${GITHUB_PATH}"
          "${clang_bin}/clang" --version

      # This cache contains the generated configuration, headers, host tools,
      # and Module.symvers needed for a fast external-module build. Its key does
      # not include MemKernel sources, so driver-only changes reuse it.
      - name: Restore prepared kernel cache
        id: prepared-kernel
        uses: actions/cache/restore@v4
        with:
          path: kernel-out
          key: prepared-evox-marble-${{ env.PREPARED_CACHE_REVISION }}-${{ env.KERNEL_COMMIT }}-r563880c

      - name: Restore compiler object cache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-evox-marble-${{ runner.os }}-${{ env.KERNEL_COMMIT }}-${{ hashFiles('MemKernel/kernel/**') }}
          restore-keys: |
            ccache-evox-marble-${{ runner.os }}-${{ env.KERNEL_COMMIT }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin:${PATH}"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats || true

      # CONFIG_MODVERSIONS requires Module.symvers from a real kernel link.
      # This expensive step runs only when the exact prepared cache is absent.
      - name: Prepare exact Evolution X kernel ABI
        if: steps.prepared-kernel.outputs.cache-hit != 'true'
        shell: bash
        working-directory: android-kernel
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin:${PATH}"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true

          make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" gki_defconfig

          ./scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/marble_GKI.config \
            arch/arm64/configs/vendor/debugfs.config

          make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" olddefconfig
          make O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" syncconfig

          grep -q '^CONFIG_MODULES=y$' "${OUT_DIR}/.config"
          grep -q '^CONFIG_MODVERSIONS=y$' "${OUT_DIR}/.config"

          release="$(make -s O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease)"
          echo "Prepared kernel release: ${release}"
          test "${release}" = "${EXPECTED_KERNEL_RELEASE}"

          # Linking Image/vmlinux is required to generate correct symbol CRCs.
          make -j"${MAKE_JOBS}" O="${OUT_DIR}" ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" Image

          test -s "${OUT_DIR}/Module.symvers"
          test -x "${OUT_DIR}/scripts/mod/modpost"

      - name: Verify prepared ABI cache
        shell: bash
        working-directory: android-kernel
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin:${PATH}"

          test -s "${OUT_DIR}/.config"
          test -s "${OUT_DIR}/Module.symvers"
          grep -q '^CONFIG_MODVERSIONS=y$' "${OUT_DIR}/.config"

          release="$(make -s O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease)"
          echo "Cached kernel release: ${release}"
          test "${release}" = "${EXPECTED_KERNEL_RELEASE}"

      # Save the expensive prepared ABI before compiling MemKernel. This cache
      # remains useful even when a later module build exposes a real symbol error.
      - name: Prune new prepared cache
        if: steps.prepared-kernel.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "${OUT_DIR}/vmlinux" \
            "${OUT_DIR}/vmlinux.o" \
            "${OUT_DIR}/System.map" \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${OUT_DIR}/arch/arm64/boot/Image.lz4"
          find "${OUT_DIR}" -type f \
            \( -name '*.o' -o -name '*.a' -o -name '*.ll' -o -name '*.bc' \) \
            -not -path "${OUT_DIR}/scripts/*" -delete
          test -s "${OUT_DIR}/Module.symvers"
          test -x "${OUT_DIR}/scripts/mod/modpost"
          du -sh "${OUT_DIR}"

      - name: Save prepared kernel cache
        if: steps.prepared-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-out
          key: prepared-evox-marble-${{ env.PREPARED_CACHE_REVISION }}-${{ env.KERNEL_COMMIT }}-r563880c

      - name: Stage MemKernel as an external module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${MODULE_DIR}"
          mkdir -p "${MODULE_DIR}"
          rsync -a --delete --exclude='.git/' \
            "${GITHUB_WORKSPACE}/MemKernel/kernel/" "${MODULE_DIR}/"

          # The existing Kbuild uses obj-$(CONFIG_MEMKERNEL). Passing
          # CONFIG_MEMKERNEL=m below selects it without dirtying the kernel tree.
          grep -q 'CONFIG_MEMKERNEL' "${MODULE_DIR}/Makefile"

      - name: Build LKM only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin:${PATH}"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_NOHASHDIR=true

          make -j"$(nproc)" -C "${KERNEL_DIR}" O="${OUT_DIR}" \
            M="${MODULE_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" CONFIG_MEMKERNEL=m modules

          test -s "${MODULE_DIR}/miprotect.ko"

      - name: Validate and package LKM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/android-clang/${CLANG_VERSION}/bin:${PATH}"
          mkdir -p "${DIST_DIR}"

          cp "${MODULE_DIR}/miprotect.ko" "${DIST_DIR}/miprotect.ko"
          llvm-strip --strip-debug "${DIST_DIR}/miprotect.ko"

          vermagic="$(modinfo -F vermagic "${DIST_DIR}/miprotect.ko")"
          echo "${vermagic}" | tee "${DIST_DIR}/vermagic.txt"
          case "${vermagic}" in
            "${EXPECTED_KERNEL_RELEASE}"*) ;;
            *)
              echo "::error::Unexpected module vermagic: ${vermagic}"
              exit 1
              ;;
          esac

          sha256sum "${DIST_DIR}/miprotect.ko" | tee "${DIST_DIR}/miprotect.ko.sha256"
          {
            echo "kernel_repository=${KERNEL_REPOSITORY}"
            echo "kernel_commit=${KERNEL_COMMIT}"
            echo "kernel_release=${EXPECTED_KERNEL_RELEASE}"
            echo "clang_version=${CLANG_VERSION}"
            echo "clang_commit=${CLANG_COMMIT}"
            echo "module_vermagic=${vermagic}"
            echo "prepared_cache_hit=${{ steps.prepared-kernel.outputs.cache-hit }}"
            echo "ccache_hit=${{ steps.ccache.outputs.cache-hit }}"
          } > "${DIST_DIR}/build-info.txt"

          ccache --show-stats | tee "${DIST_DIR}/ccache-stats.txt" || true

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: evolution-x-marble-5.10.256-miprotect
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            dist/miprotect.ko
            dist/miprotect.ko.sha256
            dist/vermagic.txt
            dist/build-info.txt
            dist/ccache-stats.txt
